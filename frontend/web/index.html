<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nutrition and health tracking with an AI coach.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NutriAI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NutriAI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while main.dart.js downloads, before Flutter can draw anything.
       Plain CSS on purpose: no framework is running yet. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F2EFE6;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #131210; }
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      /* Fades out rather than cutting, so the handover is not a jolt. */
      transition: opacity 0.35s ease;
    }

    #boot.done {
      opacity: 0;
      pointer-events: none;
    }

    .mark {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1C1A15;
    }

    .mark span { color: #8A6318; font-weight: 500; }

    @media (prefers-color-scheme: dark) {
      .mark { color: #EDE7DA; }
      .mark span { color: #DCAD52; }
    }

    /* A determinate-looking sweep, not a fake percentage: it shows the
       app is loading without claiming to know how far along it is. */
    .track {
      width: 148px;
      height: 2px;
      background: #CFC7B2;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      .track { background: #35312A; }
    }

    .track::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #B8501F;
      animation: sweep 1.1s ease-in-out infinite;
    }

    @media (prefers-color-scheme: dark) {
      .track::after { background: #D9673A; }
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Respect the system setting for reduced motion. */
    @media (prefers-reduced-motion: reduce) {
      .track::after { animation: none; width: 100%; opacity: 0.5; }
      #boot { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">Nutri<span>AI</span></div>
    <div class="track"></div>
  </div>

  <script>
    // Flutter fires this once the first frame is painted. Removing the
    // overlay any earlier would expose a blank canvas.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 400);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
