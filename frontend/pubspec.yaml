name: nutriai
description: "Nutrition and health tracking with an AI coach."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Archivo and IBM Plex Mono, fetched at runtime.
  # Swapped for bundled .ttf files in Phase 9 so the app works offline.
  google_fonts: ^8.2.1

  # State that outlives a single screen: theme, session, profile.
  flutter_riverpod: ^3.4.3

  # URL-based navigation. On web this gives real addresses and a
  # working browser back button.
  go_router: ^18.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/